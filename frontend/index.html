<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="/icon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/icon-dark.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="/icon-light.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="apple-mobile-web-app-title" content="بوتد" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="بوتد مجتمع عربي للأمن السيبراني. شارك اكتشافاتك، اسأل، وتواصل مع ناس تشبهك."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="بوتد" />
    <meta property="og:title" content="بوتد — مجتمع الأمن السيبراني العربي" />
    <meta
      property="og:description"
      content="بوتد مجتمع عربي للأمن السيبراني. شارك اكتشافاتك، اسأل، وتواصل مع ناس تشبهك."
    />
    <meta property="og:image" content="/pootd-wordmark.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>بوتد — مجتمع الأمن السيبراني العربي</title>
    <script>
      // Applies the saved theme before first paint so the page never flashes white.
      ;(function () {
        try {
          var stored = window.localStorage.getItem('pootd-theme')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var dark = stored === 'dark' || (stored !== 'light' && prefersDark)
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.setProperty('color-scheme', dark ? 'dark' : 'light')
        } catch (error) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
